---
# See the documentation for more information:
# https://packit.dev/docs/configuration/

upstream_tag_template: v{version}

srpm_build_deps:
  - make

# Jobs select packages explicitly so Wayland builds do not run QM integration tests.
packages:
  qm:
    specfile_path: rpm/qm.spec
    actions:
      fix-spec-file:
        - bash .packit.sh

  qm-wayland:
    specfile_path: rpm/wayland/qm-wayland.spec
    actions:
      fix-spec-file:
        - bash .packit-wayland.sh

jobs:
  - &pr_job
    job: copr_build
    trigger: pull_request
    packages: [qm]
    targets: &pr_targets
      fedora-stable: {}
      epel-10:
        additional_repos:
          - copr://@centos-automotive-sig/bluechi-snapshot

  # Run on commit to main branch
  - &copr
    job: copr_build
    trigger: commit
    packages: [qm]
    branch: main
    owner: "@centos-automotive-sig"
    project: qm-next
    enable_net: true
    notifications:
      failure_comment:
        message: "QM build failed for merged commit {commit_sha}. Please check logs {logs_url}"

  - <<: *copr
    targets: &multiarch_targets
      - fedora-stable-aarch64
      - fedora-stable-ppc64le
      - fedora-stable-x86_64
      - epel-10-aarch64
      - epel-10-ppc64le
      - epel-10-x86_64

  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: e2e-multi-bluechi-agents
    tmt_plan: /plans/e2e/multi-bluechi-agents
    targets:
      - epel-10-x86_64
    manual_trigger: true
    tf_extra_params:
      environments:
        - artifacts:
            - &bluechi_copr_repo_c10s
              type: repository-file
              id: https://copr.fedorainfracloud.org/coprs/g/centos-automotive-sig/bluechi-snapshot/repo/centos-stream-10
            - &bluechi_copr_repo_fedora
              type: repository-file
              id: https://copr.fedorainfracloud.org/coprs/g/centos-automotive-sig/bluechi-snapshot/repo/fedora
          hardware:
            disk:
              - size: ">= 20 GB"


  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: e2e-ffi
    tmt_plan: /plans/e2e/ffi
    targets:
      - epel-10-x86_64
    tf_extra_params:
      environments:
        - artifacts:
            - *bluechi_copr_repo_c10s
          tmt:
            context:
              scenario: "ffi"
          hardware:
            disk:
              - size: ">= 20 GB"
              - size: ">= 20 GB"

  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: qm-tier-0
    tmt_plan: /plans/e2e/tier-0
    targets:
      - epel-10-x86_64
    tf_extra_params:
      environments:
        - artifacts:
            - *bluechi_copr_repo_c10s
          hardware:
            disk:
              - size: ">= 20 GB"

  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: kvm-tier-0
    tmt_plan: /plans/e2e/kvm-tier-0
    targets:
      - fedora-42-x86_64
      - epel-10-x86_64
    tf_extra_params:
      environments:
        - artifacts:
            - *bluechi_copr_repo_c10s
            - *bluechi_copr_repo_fedora
          hardware:
            disk:
              - size: ">= 20 GB"
            virtualization:
              is-supported: true

  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: qmc-smoke
    tmt_plan: /plans/qmc-smoke
    # The isolated launcher tests build their fixtures from the PR source.
    skip_build: true
    targets:
      - epel-10-x86_64

  - job: tests
    trigger: pull_request
    packages: [qm]
    identifier: automotive-image-builder
    tmt_plan: /plans/e2e/aib
    targets:
      - epel-10-x86_64
    tf_extra_params:
      environments:
        - hardware:
            disk:
              - size: ">= 20 GB"


  - job: propose_downstream
    trigger: release
    packages: [qm]
    dist_git_branches: &downstream_branches
      - fedora-all
      - epel-10

  - job: koji_build
    trigger: commit
    packages: [qm]
    dist_git_branches: *downstream_branches

  - job: bodhi_update
    trigger: commit
    packages: [qm]
    dist_git_branches: &bodhi_branches
      # rawhide updates are created automatically
      - fedora-branched
      - epel-10

  # QM Wayland package
  - job: copr_build
    trigger: pull_request
    packages: [qm-wayland]
    identifier: qm-wayland
    targets: *pr_targets

  - <<: *copr
    packages: [qm-wayland]
    identifier: qm-wayland-main
    targets: *multiarch_targets
    notifications:
      failure_comment:
        message: "QM Wayland build failed for merged commit {commit_sha}. Please check logs {logs_url}"

  # Downstream jobs for qm-wayland
  - job: propose_downstream
    trigger: release
    packages: [qm-wayland]
    identifier: qm-wayland-downstream
    dist_git_branches: *downstream_branches

  - job: koji_build
    trigger: commit
    packages: [qm-wayland]
    identifier: qm-wayland-koji
    dist_git_branches: *downstream_branches

  - job: bodhi_update
    trigger: commit
    packages: [qm-wayland]
    identifier: qm-wayland-bodhi
    dist_git_branches: *bodhi_branches
