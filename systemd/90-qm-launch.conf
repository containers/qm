# Keep udev's systemd-sysctl calls from overriding QM's interface settings.
# The interfaces are created after the early-boot sysctl pass.
-net/ipv4/conf/qm-veth/forwarding = 1
-net/ipv4/conf/qm-veth/rp_filter = 2
-net/ipv6/conf/qm-veth/disable_ipv6 = 1
